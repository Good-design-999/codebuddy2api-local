# Support legacy Compose syntax; .env is loaded wholesale through env_file.
version: "3.8"


services:
  codebuddy2api:
    image: ${CODEBUDDY2API_IMAGE:-ghcr.io/maiphucgiang/codebuddy2api:latest}
    build: .
    container_name: codebuddy2api
    ports:
      - "${CODEBUDDY2API_BIND:-127.0.0.1}:${CODEBUDDY2API_PORT:-8787}:8787"
    volumes:
      # Persist credentials, SQLite databases and WAL/SHM files in one writable local directory.
      - "${CODEBUDDY2API_AUTH_PATH:-./auth}:/data/auth"
    env_file:
      # Every key in .env reaches the container; keys the gateway does not know are ignored.
      # Optional, so a missing .env keeps the gateway defaults and settings saved in SQLite.
      - path: ${CODEBUDDY2API_ENV_FILE:-.env}
        required: false
    environment:
      # Container paths stay fixed; a host-side CODEBUDDY_AUTH_DIR would point outside the mount.
      CODEBUDDY_AUTH_DIR: /data/auth
      # Bind every container interface and let the host mapping control external exposure.
      CODEBUDDY2API_ALLOW_OPEN_NOAUTH: "true"
    # The image CMD already runs converter.py with --host 0.0.0.0, --port 8787 and --desensitize.
    restart: unless-stopped
